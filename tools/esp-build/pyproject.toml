[project]
name = "esp-build"
version = "0.1.0"
description = "Scaffold and compile ESP32 Arduino firmware that stays OTA-updatable."
requires-python = ">=3.11"
dependencies = ["tb-contract", "platformio>=6.1"]

[project.scripts]
esp-build = "esp_build.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
tb-contract = { path = "../../lib/tb_contract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
