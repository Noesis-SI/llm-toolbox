[project]
name = "esp-logs"
version = "0.1.0"
description = "Read log output and health of ESP32 devices built with esp-build, over WiFi."
requires-python = ">=3.11"
dependencies = ["tb-contract"]

[project.scripts]
esp-logs = "esp_logs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
tb-contract = { path = "../../lib/tb_contract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
