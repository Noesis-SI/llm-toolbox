[project]
name = "browse"
version = "0.1.0"
description = "Headless Chromium for pages that need JavaScript, forms or clicks. Stops at CAPTCHAs and access walls."
requires-python = ">=3.11"
dependencies = ["tb-contract", "playwright>=1.45"]

[project.scripts]
browse = "browse.cli:main"

[tool.uv.sources]
tb-contract = { path = "../../lib/tb_contract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
